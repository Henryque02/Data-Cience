# Alvos: WIN e WDO exportados do MT5, em horário de Brasília. O primeiro arquivo vale até
# a véspera de switch_date e o segundo a partir dela (professor até 05/11/2021, Genial depois).

targets:
  win: {files: [WIN-professor.csv, WIN-metaTrader.csv], switch_date: '2021-11-08', timezone: America/Sao_Paulo}
  wdo: {files: [WDO-professor.csv, WDO-metaTrader.csv], switch_date: '2021-11-08', timezone: America/Sao_Paulo}
  
# Externos: id do projeto -> código na Dukascopy.
externals:
  spx: usa500idxusd     # S&P 500
  ndx: usatechidxusd    # Nasdaq 100
  sx5e: eusidxeur       # Europe 50
  ftse: gbridxgbp       # FTSE 100
  nikkei: jpnidxjpy     # Nikkei 225
  a50: chiidxusd        # China A50
  hsi: hkgidxhkd        # Hang Seng (Hong Kong)
  brent: brentcmdusd    # Petróleo Brent
  gold: xauusd          # Ouro
  dxy: dollaridxusd     # Dollar Index
  usdmxn: usdmxn        # USD/MXN
  copper: coppercmdusd  # Cobre
  eurusd: eurusd        # EUR/USD
  usdjpy: usdjpy        # USD/JPY
  usdzar: usdzar        # USD/ZAR (também representa o rand da lista)
  usdcnh: usdcnh        # Yuan offshore; não é o CNY doméstico
  usdchf: usdchf        # Franco suíço
  audusd: audusd        # Dólar australiano
  btcusd: btcusd        # Bitcoin/USD, CFD da Dukascopy
  ethusd: ethusd        # Ether/USD, CFD da Dukascopy
# Download dos externos. Começa duas semanas antes do período de análise (sample).
download:
  start: '2020-10-01'
  workers: 3
  batch_size: 10
  batch_pause_ms: 1000
  retries: 3
  timeout_seconds: 300

features:
  pre_open:
    cutoff_brt: '08:58'
    # Quarta-feira de Cinzas (abertura às 13:00, marcada pelo calendário da B3).
    special_cutoff_brt: '12:58'
    # CFDs que trocam de contrato na pausa diária: a troca alonga a pausa para estes
    # minutos (normal: Brent 181, cobre 61), e o salto da reabertura é descontado.
    roll_pause_minutes: {brent: [200, 201], copper: [80, 81]}
    # Preço de fora no fechamento da B3 em D-1 mais velho que isso: feriado lá fora em D-1,
    # e o overnight fica vazio (23/11/2026).
    max_start_age_hours: 24

sample:
  # Período de análise: primeiro e último dia comuns a WIN e WDO.
  start: '2020-10-15'
  end: '2026-11-06'

labels:
  # Limiar do gap por alvo (17/11/2026). O do WDO deixa a mesma proporção de dias normais
  # que o do WIN nos dois primeiros anos, que só servem de treino (44%).
  gap_threshold: {win: 0.003, wdo: 0.0025}

models:
  logistic_c: 0.1
  
walk_forward:
  train_years: 2
  test_months: 3
  step_months: 3
  # Fim do período de desenvolvimento. Os 12 meses seguintes ficam reservados para o
  # teste final (decisão de 17/11/2026), lidos uma única vez, e não entram nos estudos.
  dev_end: '2025-11-06'
