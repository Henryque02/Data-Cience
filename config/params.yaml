# Alvos: WIN e WDO exportados do MT5, em horário de Brasília. O primeiro arquivo vale até
# a véspera de switch_date e o segundo a partir dela (professor até 05/11/2021, Genial depois).

targets:
  win: {files: [WIN-professor.csv, WIN-metaTrader.csv], switch_date: '2021-11-08', timezone: America/Sao_Paulo}
  wdo: {files: [WDO-professor.csv, WDO-metaTrader.csv], switch_date: '2021-11-08', timezone: America/Sao_Paulo}
  
# Externos: id do projeto -> código na Dukascopy.
externals:
  spx: usa500idxusd     # S&P 500
  ndx: usatechidxusd    # Nasdaq 100
  sx5e: eusidxeur       # Europe 50
  ftse: gbridxgbp       # FTSE 100
  nikkei: jpnidxjpy     # Nikkei 225
  a50: chiidxusd        # China A50
  brent: brentcmdusd    # Petróleo Brent
  gold: xauusd          # Ouro
  dxy: dollaridxusd     # Dollar Index
  usdmxn: usdmxn        # USD/MXN
  copper: coppercmdusd  # Cobre
  eurusd: eurusd        # EUR/USD
  usdjpy: usdjpy        # USD/JPY
# Download dos externos. Começa duas semanas antes do período de análise (sample).
download:
  start: '2020-10-01'
  workers: 3
  batch_size: 10
  batch_pause_ms: 1000
  retries: 3
  timeout_seconds: 300

features:
  pre_open:
    cutoff_brt: '08:58'
    recent_windows_minutes: [60, 180]
    # Preço mais velho que isso fica vazio (7 dias: cobre feriados prolongados lá fora).
    max_price_age_minutes: 10080
    # CFDs que trocam de contrato na pausa diária: os retornos ignoram o salto da reabertura
    # depois de pausas entre 30 min e 12 h (fins de semana são mantidos).
    daily_pause_assets: [brent, copper]
    daily_pause_minutes: [30, 720]
    asia_sessions:
      nikkei: {timezone: Asia/Tokyo, start: '09:00', end: '15:30'}
      a50: {timezone: Asia/Shanghai, start: '09:30', end: '15:00'}

sample:
  # Período de análise: primeiro e último dia comuns a WIN e WDO.
  start: '2020-10-15'
  end: '2026-11-06'

labels:
  post_open_minutes: 60
  gap_threshold:
    value: 0.003
  behavior:
    trend_margin: 0.001

models:
  logistic_c: 0.1
  
walk_forward:
  train_years: 2
  test_months: 3
  step_months: 3
  min_train_rows: 60

backtest:
  status: pending_future_phase
  entry_rule: next_candle_after_first
  slippage_ticks_per_side: 1
  sensitivity_ticks: [0, 1, 2]
  simultaneous_target_stop: worst_case
  contracts:
    win: {brl_per_point: 0.20, tick_points: 5, fees_brl_per_side: null, brokerage_brl_per_side: null}
    wdo: {brl_per_point: 10.0, tick_points: 0.5, fees_brl_per_side: null, brokerage_brl_per_side: null}
