[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abertura-b3"
version = "0.1.0"
description = "Dados e classificação da abertura da B3"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2,<2.5", # pandas 2.x usa timedelta genérico, descontinuado no NumPy 2.5.
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "pyyaml>=6,<7",
  "tzdata>=2024.1",
  "exchange-calendars>=4.11,<5",
  "scikit-learn>=1.5,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/abertura"]
